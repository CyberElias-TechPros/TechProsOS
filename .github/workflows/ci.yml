name: CI
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + PostgreSQL-engine integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit (release gate)
        run: npm audit --audit-level=moderate
      - name: Initial JS budget (300 KB gzip)
        run: node scripts/check-bundle-budget.mjs
